name: foda-kaggle-mirror-verify

on:
  push:
    paths:
      - ".github/workflows/foda-kaggle-mirror-verify.yml"
      - "src/aeroguard/datasets/**"
  workflow_dispatch:

concurrency:
  group: foda-kaggle-mirror-verify
  cancel-in-progress: true

jobs:
  verify-mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OFFICIAL_ARCHIVE_SHA256: 408af3ac5be8af399367a7a846c6bd720727391c2d89de17985321c27468dd87
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install AeroGuard
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download public Kaggle mirror package
        run: |
          mkdir -p /tmp/foda-mirror/extracted artifacts/foda_kaggle_verify
          curl -L --fail --retry 3 \
            "https://www.kaggle.com/api/v1/datasets/download/kilogrand/foreign-object-debris-in-airports-fod-a-dataset" \
            -o /tmp/foda-mirror/kaggle_dataset.zip
          ls -lh /tmp/foda-mirror/kaggle_dataset.zip
          sha256sum /tmp/foda-mirror/kaggle_dataset.zip | tee artifacts/foda_kaggle_verify/kaggle_package.sha256
          unzip -l /tmp/foda-mirror/kaggle_dataset.zip > artifacts/foda_kaggle_verify/package_listing.txt
          unzip -q /tmp/foda-mirror/kaggle_dataset.zip -d /tmp/foda-mirror/extracted

      - name: Inspect mirror corpus independently of source split defects
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from aeroguard.datasets.foda import summarize_voc_dataset

          root = Path('/tmp/foda-mirror/extracted')
          summary = summarize_voc_dataset(root).as_dict()
          payload = {
              'dataset': 'FOD-A',
              'source_version': '2.1 Pascal VOC',
              'acquisition': 'Kaggle public mirror',
              'summary': summary,
          }
          out = Path('artifacts/foda_kaggle_verify/mirror_manifest.json')
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({k: v for k, v in summary.items() if k != 'object_areas'}, indent=2, sort_keys=True))
          PY

      - name: Compare mirror corpus against frozen official-corpus audit
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(Path('artifacts/foda_kaggle_verify/mirror_manifest.json').read_text())['summary']
          expected_class_counts = {
              'AdjustableClamp': 544, 'AdjustableWrench': 472, 'Battery': 1059,
              'Bolt': 3300, 'BoltNutSet': 514, 'BoltWasher': 1017,
              'ClampPart': 917, 'Cutter': 1352, 'FuelCap': 548, 'Hammer': 760,
              'Hose': 294, 'Label': 1310, 'LuggagePart': 738, 'LuggageTag': 1686,
              'MetalPart': 970, 'MetalSheet': 394, 'Nail': 1193, 'Nut': 1303,
              'PaintChip': 968, 'Pen': 483, 'PlasticPart': 2008, 'Pliers': 2884,
              'Rock': 662, 'Screw': 157, 'Screwdriver': 811, 'SodaCan': 950,
              'Tape': 127, 'Washer': 2139, 'Wire': 2138, 'Wood': 206, 'Wrench': 2568,
          }
          small_count = sum(float(area) < 1024.0 for area in summary['object_areas'])
          actual = {
              'annotation_files': summary['annotation_files'],
              'images_with_objects': summary['images_with_objects'],
              'total_objects': summary['total_objects'],
              'class_count': summary['class_count'],
              'class_counts': summary['class_counts'],
              'image_widths': summary['image_widths'],
              'image_heights': summary['image_heights'],
              'small_object_count_lt_1024': small_count,
          }
          expected = {
              'annotation_files': 33793,
              'images_with_objects': 33793,
              'total_objects': 34472,
              'class_count': 31,
              'class_counts': expected_class_counts,
              'image_widths': [300],
              'image_heights': [300],
              'small_object_count_lt_1024': 9852,
          }
          mismatches = {k: {'expected': expected[k], 'actual': actual[k]} for k in expected if actual[k] != expected[k]}
          report = {
              'schema': 'aeroguard.foda.mirror_equivalence.v1',
              'mirror': 'Kaggle kilogrand/foreign-object-debris-in-airports-fod-a-dataset',
              'official_archive_sha256_reference': os.environ['OFFICIAL_ARCHIVE_SHA256'],
              'byte_identical_to_official_archive': False,
              'reason_byte_identity_unavailable': 'Kaggle package contains the extracted FODPascalVOCFormat-V.2.1 tree rather than the original official zip container.',
              'frozen_official_audit_expected': expected,
              'mirror_actual': actual,
              'structural_equivalence_pass': not mismatches,
              'mismatches': mismatches,
              'usage_policy': 'Temporary acquisition fallback only. Official source URL/archive SHA remain canonical provenance; split artifacts must be rechecked against the official archive when Google Drive quota permits.',
          }
          out = Path('artifacts/foda_kaggle_verify/equivalence.json')
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(out.read_text())
          if mismatches:
              raise SystemExit(f'mirror corpus differs from frozen official audit: {mismatches}')
          PY

      - name: Audit source trainval/test and preserve defect evidence
        run: |
          python - <<'PY'
          import collections
          import hashlib
          import json
          from pathlib import Path

          root = Path('/tmp/foda-mirror/extracted')
          trainval = next(root.rglob('ImageSets/Main/trainval.txt'))
          test = next(root.rglob('ImageSets/Main/test.txt'))
          ann_dir = next(p for p in root.rglob('Annotations') if p.is_dir())

          def read_ids(path):
              raw = path.read_bytes()
              ids = [line.strip().split()[0] for line in raw.decode('utf-8').splitlines() if line.strip()]
              return raw, ids

          def unique_in_order(ids):
              return list(dict.fromkeys(ids))

          tr_raw, tr = read_ids(trainval)
          te_raw, te = read_ids(test)
          tr_u, te_u = unique_in_order(tr), unique_in_order(te)
          tr_set, te_set = set(tr_u), set(te_u)
          ann_ids = {p.stem for p in ann_dir.glob('*.xml')}
          tr_dupes = {k: v for k, v in collections.Counter(tr).items() if v > 1}
          te_dupes = {k: v for k, v in collections.Counter(te).items() if v > 1}
          overlap = sorted(tr_set & te_set)
          missing = sorted(ann_ids - (tr_set | te_set))
          extra = sorted((tr_set | te_set) - ann_ids)

          normalized_dir = Path('artifacts/foda_kaggle_verify/normalized_source_split')
          normalized_dir.mkdir(parents=True, exist_ok=True)
          tr_norm = normalized_dir / 'trainval_unique_only.txt'
          te_norm = normalized_dir / 'test_unique_only.txt'
          tr_norm.write_text(''.join(f'{x}\n' for x in tr_u), encoding='utf-8')
          te_norm.write_text(''.join(f'{x}\n' for x in te_u), encoding='utf-8')
          (normalized_dir / 'overlap_ids.txt').write_text(''.join(f'{x}\n' for x in overlap), encoding='utf-8')
          (normalized_dir / 'missing_ids.txt').write_text(''.join(f'{x}\n' for x in missing), encoding='utf-8')

          report = {
              'schema': 'aeroguard.foda.source_split_audit.v3',
              'provenance_status': 'provisional_from_structurally_equivalent_kaggle_mirror_pending_official-byte-source_recheck',
              'source_split_usable_as_clean_holdout': False,
              'reason': 'duplicate IDs, cross-split overlap, and uncovered annotation IDs were detected',
              'trainval_raw_count': len(tr),
              'test_raw_count': len(te),
              'trainval_unique_count': len(tr_u),
              'test_unique_count': len(te_u),
              'trainval_duplicate_occurrences': len(tr) - len(tr_u),
              'test_duplicate_occurrences': len(te) - len(te_u),
              'trainval_duplicate_ids': len(tr_dupes),
              'test_duplicate_ids': len(te_dupes),
              'trainval_duplicate_examples': list(sorted(tr_dupes.items()))[:20],
              'test_duplicate_examples': list(sorted(te_dupes.items()))[:20],
              'trainval_raw_sha256': hashlib.sha256(tr_raw).hexdigest(),
              'test_raw_sha256': hashlib.sha256(te_raw).hexdigest(),
              'trainval_unique_only_sha256': hashlib.sha256(tr_norm.read_bytes()).hexdigest(),
              'test_unique_only_sha256': hashlib.sha256(te_norm.read_bytes()).hexdigest(),
              'overlap_unique_ids': len(overlap),
              'overlap_ids': overlap,
              'annotation_count': len(ann_ids),
              'union_unique_count': len(tr_set | te_set),
              'missing_annotation_ids_from_split_union': len(missing),
              'missing_ids': missing,
              'split_ids_without_annotations': len(extra),
              'extra_ids': extra,
          }
          out = Path('artifacts/foda_kaggle_verify/source_split_audit.json')
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({k: v for k, v in report.items() if k not in {'missing_ids'}}, indent=2, sort_keys=True))
          PY

      - name: Preserve categorization metadata and probe sequence structure
        run: |
          python - <<'PY'
          import csv
          import json
          import shutil
          import statistics
          import xml.etree.ElementTree as ET
          from collections import Counter
          from pathlib import Path

          root = Path('/tmp/foda-mirror/extracted')
          csv_path = next(root.rglob('FOD_categorization_annotations.csv'))
          info_path = next(root.rglob('category_information.txt'))
          outdir = Path('artifacts/foda_kaggle_verify/categorization')
          outdir.mkdir(parents=True, exist_ok=True)
          shutil.copy2(csv_path, outdir / csv_path.name)
          shutil.copy2(info_path, outdir / info_path.name)

          with csv_path.open(newline='', encoding='utf-8-sig') as fh:
              rows = list(csv.DictReader(fh))
          headers = list(rows[0].keys()) if rows else []
          env_counts = Counter((r.get('Weather'), r.get('Light')) for r in rows)
          parent_counts = Counter(str(Path(r.get('File', '')).parent) for r in rows)

          ann_dir = next(p for p in root.rglob('Annotations') if p.is_dir())
          signatures = []
          for path in sorted(ann_dir.glob('*.xml')):
              tree = ET.parse(path)
              labels = tuple(sorted(obj.findtext('name', '') for obj in tree.findall('object')))
              signatures.append((int(path.stem), labels))
          runs = []
          if signatures:
              start_id, last_id, sig = signatures[0][0], signatures[0][0], signatures[0][1]
              for image_id, labels in signatures[1:]:
                  if image_id == last_id + 1 and labels == sig:
                      last_id = image_id
                  else:
                      runs.append((start_id, last_id, sig))
                      start_id = last_id = image_id
                      sig = labels
              runs.append((start_id, last_id, sig))
          lengths = [b - a + 1 for a, b, _ in runs]
          seq = {
              'csv_headers': headers,
              'csv_rows': len(rows),
              'csv_first_rows': rows[:10],
              'csv_last_rows': rows[-10:],
              'weather_light_counts': {f'{k[0]}|{k[1]}': v for k, v in sorted(env_counts.items())},
              'distinct_file_parent_paths': len(parent_counts),
              'top_file_parent_paths': parent_counts.most_common(20),
              'annotation_same-label_contiguous_runs': len(runs),
              'run_length_min': min(lengths) if lengths else None,
              'run_length_median': statistics.median(lengths) if lengths else None,
              'run_length_mean': statistics.mean(lengths) if lengths else None,
              'run_length_max': max(lengths) if lengths else None,
              'runs_ge_5': sum(x >= 5 for x in lengths),
              'runs_ge_15': sum(x >= 15 for x in lengths),
              'runs_ge_30': sum(x >= 30 for x in lengths),
              'first_runs': [
                  {'start': f'{a:06d}', 'end': f'{b:06d}', 'length': b-a+1, 'labels': list(sig)}
                  for a, b, sig in runs[:30]
              ],
          }
          out = Path('artifacts/foda_kaggle_verify/sequence_probe.json')
          out.write_text(json.dumps(seq, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(seq, indent=2, sort_keys=True))
          PY

      - name: Mark source split gate result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('artifacts/foda_kaggle_verify/source_split_audit.json').read_text())
          gate = {
              'schema': 'aeroguard.foda.split_gate.v1',
              'source_split_pass': bool(report['source_split_usable_as_clean_holdout']),
              'action': 'design and freeze a replacement leakage-aware split; do not train against the defective source split',
          }
          Path('artifacts/foda_kaggle_verify/split_gate.json').write_text(json.dumps(gate, indent=2, sort_keys=True) + '\n')
          print(json.dumps(gate, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foda-kaggle-mirror-verification
          path: artifacts/foda_kaggle_verify/
          retention-days: 30
