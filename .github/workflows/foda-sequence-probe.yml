name: foda-sequence-probe

on:
  push:
    paths:
      - ".github/workflows/foda-sequence-probe.yml"
  workflow_dispatch:

concurrency:
  group: foda-sequence-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install AeroGuard
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download and extract structurally verified public mirror
        run: |
          mkdir -p /tmp/foda/extracted artifacts/foda_sequence_probe
          curl -L --fail --retry 3 \
            "https://www.kaggle.com/api/v1/datasets/download/kilogrand/foreign-object-debris-in-airports-fod-a-dataset" \
            -o /tmp/foda/dataset.zip
          unzip -q /tmp/foda/dataset.zip -d /tmp/foda/extracted

      - name: Measure metadata and visual transition structure
        run: |
          python - <<'PY'
          import csv
          import json
          import math
          import statistics
          import xml.etree.ElementTree as ET
          from collections import Counter
          from pathlib import Path

          import cv2
          import numpy as np

          root = Path('/tmp/foda/extracted')
          csv_path = next(root.rglob('FOD_categorization_annotations.csv'))
          ann_dir = next(p for p in root.rglob('Annotations') if p.is_dir())
          image_dir = next(p for p in root.rglob('JPEGImages') if p.is_dir())

          labels_by_id = {}
          bbox_by_id = {}
          for path in sorted(ann_dir.glob('*.xml')):
              tree = ET.parse(path)
              labels = tuple(sorted(obj.findtext('name', '') for obj in tree.findall('object')))
              boxes = []
              for obj in tree.findall('object'):
                  bb = obj.find('bndbox')
                  if bb is not None:
                      boxes.append(tuple(float(bb.findtext(k, '0')) for k in ('xmin','ymin','xmax','ymax')))
              labels_by_id[path.stem] = labels
              bbox_by_id[path.stem] = boxes

          with csv_path.open(newline='', encoding='utf-8-sig') as fh:
              rows = list(csv.DictReader(fh))

          def stem(row):
              return Path(row['File']).stem

          # Base group: preserve original CSV row order and break whenever the global
          # numeric ID is not consecutive, environment changes, or annotation labels change.
          groups = []
          current = []
          boundary_reasons = Counter()
          for row in rows:
              sid = stem(row)
              if not current:
                  current = [row]
                  continue
              prev = current[-1]
              pid = stem(prev)
              reasons = []
              if int(sid) != int(pid) + 1:
                  reasons.append('nonconsecutive_id')
              if row.get('Weather') != prev.get('Weather'):
                  reasons.append('weather_change')
              if row.get('Light') != prev.get('Light'):
                  reasons.append('light_change')
              if labels_by_id.get(sid) != labels_by_id.get(pid):
                  reasons.append('label_signature_change')
              if reasons:
                  groups.append(current)
                  current = [row]
                  boundary_reasons.update(reasons)
              else:
                  current.append(row)
          if current:
              groups.append(current)

          base_lengths = [len(g) for g in groups]
          base_group_summary = []
          for idx, g in enumerate(groups):
              ids = [stem(r) for r in g]
              labels = sorted({x for sid in ids for x in labels_by_id.get(sid, ())})
              base_group_summary.append({
                  'group': idx,
                  'size': len(g),
                  'first_id': ids[0],
                  'last_id': ids[-1],
                  'weather': g[0].get('Weather'),
                  'light': g[0].get('Light'),
                  'labels': labels,
              })

          def gray_small(sid):
              path = image_dir / f'{sid}.jpg'
              img = cv2.imread(str(path), cv2.IMREAD_GRAYSCALE)
              if img is None:
                  # Some mirrors retain upper-case or alternative extension.
                  matches = list(image_dir.glob(f'{sid}.*'))
                  if not matches:
                      raise FileNotFoundError(sid)
                  img = cv2.imread(str(matches[0]), cv2.IMREAD_GRAYSCALE)
              return cv2.resize(img, (48, 48), interpolation=cv2.INTER_AREA).astype(np.float32)

          def first_box(sid):
              boxes = bbox_by_id.get(sid, [])
              return boxes[0] if boxes else None

          def iou(a, b):
              if a is None or b is None:
                  return None
              x1=max(a[0],b[0]); y1=max(a[1],b[1]); x2=min(a[2],b[2]); y2=min(a[3],b[3])
              inter=max(0,x2-x1)*max(0,y2-y1)
              aa=max(0,a[2]-a[0])*max(0,a[3]-a[1]); bb=max(0,b[2]-b[0])*max(0,b[3]-b[1])
              den=aa+bb-inter
              return inter/den if den else 0.0

          transitions = []
          for gi, g in enumerate(groups):
              for left, right in zip(g, g[1:]):
                  a, b = stem(left), stem(right)
                  ia, ib = gray_small(a), gray_small(b)
                  mad = float(np.mean(np.abs(ia-ib))/255.0)
                  transitions.append({
                      'group': gi,
                      'left': a,
                      'right': b,
                      'mad48': mad,
                      'bbox_iou': iou(first_box(a), first_box(b)),
                      'labels': list(labels_by_id.get(a, ())),
                      'weather': left.get('Weather'),
                      'light': left.get('Light'),
                  })

          vals = sorted(t['mad48'] for t in transitions)
          def quantile(q):
              if not vals:
                  return None
              pos=(len(vals)-1)*q
              lo=int(math.floor(pos)); hi=int(math.ceil(pos))
              if lo==hi: return vals[lo]
              return vals[lo]*(hi-pos)+vals[hi]*(pos-lo)

          thresholds = [0.03,0.05,0.08,0.10,0.12,0.15,0.20,0.25,0.30]
          report = {
              'schema': 'aeroguard.foda.sequence_transition_probe.v1',
              'csv_rows': len(rows),
              'base_group_count': len(groups),
              'base_group_length': {
                  'min': min(base_lengths),
                  'median': statistics.median(base_lengths),
                  'mean': statistics.mean(base_lengths),
                  'max': max(base_lengths),
                  'p90': float(np.quantile(base_lengths, .90)),
                  'p95': float(np.quantile(base_lengths, .95)),
              },
              'base_boundary_reasons': dict(boundary_reasons),
              'candidate_adjacent_transition_count': len(transitions),
              'mad48_quantiles': {str(q): quantile(q) for q in [0, .25, .5, .75, .9, .95, .975, .99, .995, .999, 1]},
              'mad48_threshold_counts': {str(t): sum(x['mad48'] >= t for x in transitions) for t in thresholds},
              'top_visual_transitions': sorted(transitions, key=lambda x: x['mad48'], reverse=True)[:100],
              'base_groups': base_group_summary,
          }
          out = Path('artifacts/foda_sequence_probe/transition_probe.json')
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({k:v for k,v in report.items() if k not in {'top_visual_transitions','base_groups'}}, indent=2, sort_keys=True))
          print('Top transitions:')
          print(json.dumps(report['top_visual_transitions'][:20], indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: foda-sequence-probe
          path: artifacts/foda_sequence_probe/
          retention-days: 30
