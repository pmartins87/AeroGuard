name: foda-scene-quality-profile

on:
  push:
    paths:
      - ".github/workflows/foda-scene-quality-profile.yml"
      - "scripts/foda_scene_quality_profile.py"
      - "src/aeroguard/scene_quality.py"
      - "tests/test_scene_quality.py"
  workflow_dispatch:

concurrency:
  group: foda-scene-quality-profile
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install AeroGuard
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify scene-quality unit tests under OpenCV 5
        run: |
          python - <<'PY'
          import cv2
          assert cv2.__version__.startswith('5.0.0'), cv2.__version__
          print(cv2.__version__)
          PY
          pytest -q tests/test_scene_quality.py

      - name: Download structurally verified public FOD-A mirror
        run: |
          mkdir -p /tmp/foda-quality/extracted artifacts/foda_scene_quality
          curl -L --fail --retry 3 \
            "https://www.kaggle.com/api/v1/datasets/download/kilogrand/foreign-object-debris-in-airports-fod-a-dataset" \
            -o /tmp/foda-quality/kaggle_dataset.zip
          sha256sum /tmp/foda-quality/kaggle_dataset.zip | tee artifacts/foda_scene_quality/kaggle_package.sha256
          unzip -q /tmp/foda-quality/kaggle_dataset.zip -d /tmp/foda-quality/extracted

      - name: Profile complete corpus
        run: |
          python scripts/foda_scene_quality_profile.py /tmp/foda-quality/extracted \
            --output artifacts/foda_scene_quality/profile.json

      - name: Verify corpus, profile and conservative guardrail gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from aeroguard.scene_quality import SceneQualityPolicy

          payload = json.loads(Path('artifacts/foda_scene_quality/profile.json').read_text())
          assert payload['opencv_version'].startswith('5.0.0')
          assert payload['image_count'] == 33793
          assert payload['overall']['count'] == 33793
          metrics = payload['overall']['metrics']
          for metric in ('mean_luma', 'dynamic_range', 'laplacian_variance', 'dark_fraction', 'clipped_high_fraction', 'entropy_bits'):
              assert metric in metrics

          policy = SceneQualityPolicy()
          # The reacquisition gate is intentionally outside observed FOD-A support:
          # all 33,793 in-distribution frames must remain usable under v1 policy.
          assert metrics['mean_luma']['min'] >= policy.min_mean_luma
          assert metrics['dynamic_range']['min'] >= policy.min_dynamic_range
          assert metrics['laplacian_variance']['min'] >= policy.min_laplacian_variance
          assert metrics['entropy_bits']['min'] >= policy.min_entropy_bits
          assert metrics['dark_fraction']['max'] <= policy.max_dark_fraction
          assert metrics['clipped_high_fraction']['max'] <= policy.max_clipped_high_fraction

          print(json.dumps({
              'image_count': payload['image_count'],
              'policy_in_distribution_failures': 0,
              'observed_min_mean_luma': metrics['mean_luma']['min'],
              'observed_min_dynamic_range': metrics['dynamic_range']['min'],
              'observed_min_laplacian_variance': metrics['laplacian_variance']['min'],
              'observed_min_entropy_bits': metrics['entropy_bits']['min'],
              'observed_max_dark_fraction': metrics['dark_fraction']['max'],
              'observed_max_clipped_high_fraction': metrics['clipped_high_fraction']['max'],
              'policy': policy.__dict__,
          }, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foda-scene-quality-profile
          path: artifacts/foda_scene_quality/
          retention-days: 30
